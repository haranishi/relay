packages:
  - apps/*
  - packages/*
  - workers/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260723.1'
  - '@turbo/darwin-64@2.10.6'
  - '@turbo/darwin-arm64@2.10.6'
  - '@turbo/linux-64@2.10.6'
  - '@turbo/linux-arm64@2.10.6'
  - '@turbo/windows-64@2.10.6'
  - '@turbo/windows-arm64@2.10.6'
  - turbo@2.10.6

# Limit security overrides to vulnerable versions; retain each dependency major.
overrides:
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'proxy-addr@>=2.0.0 <2.0.8': 2.0.8
  'qs@>=6.0.0 <6.16.1': 6.16.1
  'vite@>=8.0.0 <=8.1.5': 8.1.6
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'undici@>=7.0.0 <7.30.1': 7.30.1
